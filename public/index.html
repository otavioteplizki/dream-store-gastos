<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gastos da Dream Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --green: #2fe873;
    --green-deep: #1fbf5c;
    --green-soft: #143621;
    --bg: #0a0c0b;
    --card: #131615;
    --ink: #f2f6f3;
    --ink-soft: #a7b3ac;
    --ink-faint: #6d7a72;
    --line: #232a25;
    --expense: #ff7a63;
    --ok: #2fe873;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.45);
    --radius: 18px;
  }
  :root[data-theme="light"] {
    --green: #1fb959; --green-deep: #178a44; --green-soft: #e2f6e8;
    --bg: #f7f9f7; --card: #ffffff; --ink: #10120f; --ink-soft: #5a6660; --ink-faint: #909c95;
    --line: #e2e8e3; --expense: #c73f28; --ok: #178a44;
    --shadow: 0 1px 2px rgba(16,18,15,0.06), 0 8px 24px rgba(16,18,15,0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: "Manrope", system-ui, sans-serif; }

  .app { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  header.top .brand { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--green); font-weight: 800; }
  header.top h1 { margin: 2px 0 0; font-size: 22px; font-weight: 700; }
  .theme-toggle {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  .whoami { padding: 10px 16px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-soft); }
  .whoami button { background: none; border: none; color: var(--green); font-weight: 700; cursor: pointer; font-size: 12.5px; padding: 2px 4px; }

  .composer { padding: 16px; margin-bottom: 16px; }
  .composer label.hint { display: block; font-size: 12.5px; color: var(--ink-faint); margin-bottom: 8px; }
  .composer-row { display: flex; gap: 8px; align-items: flex-end; }
  textarea#gastoInput {
    flex: 1; resize: none; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px;
    font-family: inherit; font-size: 15px; color: var(--ink); background: var(--bg); min-height: 46px; max-height: 140px; line-height: 1.4;
  }
  textarea#gastoInput:focus { outline: none; border-color: var(--green); }
  button.send {
    background: var(--green); color: #061309; border: none; border-radius: 14px; width: 46px; height: 46px;
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  button.send:disabled { opacity: 0.45; cursor: default; }
  button.send:not(:disabled):active { transform: scale(0.96); }
  .examples { margin-top: 10px; font-size: 12px; color: var(--ink-faint); }

  .confirm { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .confirm .status-line { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 10px; }
  .confirm .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field select {
    border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 10px; font-family: inherit; font-size: 14.5px; color: var(--ink); background: var(--bg);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--green); }
  .field.error input { border-color: var(--expense); }
  .field-error-msg { font-size: 11px; color: var(--expense); }

  .confirm-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { border-radius: 12px; padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; }
  .btn-primary { background: var(--green); color: #061309; flex: 1; }
  .btn-primary:disabled { opacity: 0.45; cursor: default; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); }
  .toast { font-size: 13px; color: var(--ok); margin-top: 10px; display: none; }
  .toast.show { display: block; }

  .hero { padding: 20px 18px; margin-bottom: 14px; }
  .hero .row-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .month-select { border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-family: inherit; }
  .hero .label { font-size: 12.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .hero .amount { font-size: 34px; font-weight: 800; margin: 4px 0 0; color: var(--ink); }
  .hero .sub { font-size: 12.5px; color: var(--ink-faint); margin-top: 4px; }

  .section-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin: 22px 4px 10px; }

  .breakdown { padding: 14px 16px; }
  .cat-row { padding: 9px 0; }
  .cat-row .cat-top { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 5px; }
  .cat-top .name { color: var(--ink); font-weight: 600; }
  .cat-top .val { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .bar-bg { height: 7px; background: var(--green-soft); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--green-deep), var(--green)); border-radius: 99px; }
  .empty-state { text-align: center; padding: 28px 14px; color: var(--ink-faint); font-size: 13.5px; }

  .ledger { padding: 4px 0; }
  .day-group { margin-bottom: 6px; }
  .day-label { font-size: 12px; color: var(--ink-faint); padding: 10px 16px 4px; }
  .entry { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .day-group .entry:first-of-type { border-top: none; }
  .entry .tag { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .entry .mid { flex: 1; min-width: 0; }
  .entry .desc { font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .who { font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; }
  .entry .val { font-size: 14.5px; font-weight: 700; color: var(--expense); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .entry .del { background: none; border: none; color: var(--ink-faint); cursor: pointer; padding: 4px 6px; flex-shrink: 0; font-size: 12px; line-height: 1; border-radius: 8px; }
  .entry .del:hover { color: var(--expense); }
  .entry .del.confirming { background: var(--expense); color: #fff; font-weight: 700; }

  .foot-note { text-align: center; font-size: 11.5px; color: var(--ink-faint); margin-top: 26px; line-height: 1.5; }

  .name-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .name-modal-backdrop.show { display: flex; }
  .name-modal { background: var(--card); border-radius: var(--radius); padding: 20px; max-width: 320px; width: 100%; box-shadow: var(--shadow); }
  .name-modal h3 { margin: 0 0 6px; font-size: 17px; }
  .name-modal p { margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); }
  .name-modal input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14.5px; font-family: inherit; background: var(--bg); color: var(--ink); }
  .name-modal button { margin-top: 12px; width: 100%; }

  @media (max-width: 420px) {
    .hero .amount { font-size: 28px; }
    .confirm .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="name-modal-backdrop" id="nameModal">
  <div class="name-modal">
    <h3>Quem está lançando?</h3>
    <p>Só pra identificar cada gasto no histórico. Fica salvo neste aparelho.</p>
    <input type="text" id="nameInput" placeholder="Seu nome" maxlength="40" />
    <button class="btn btn-primary" id="nameSaveBtn">Continuar</button>
  </div>
</div>

<div class="app">
  <header class="top">
    <div>
      <div class="brand">Dream Store</div>
      <h1>Gastos da Loja</h1>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">◐</button>
  </header>

  <div class="card whoami">
    <span>Lançando como <strong id="whoamiName">—</strong></span>
    <button id="changeNameBtn">trocar</button>
  </div>

  <div class="card composer">
    <label class="hint" for="gastoInput">Escreva o gasto do jeito que fala — o sistema identifica valor e categoria sozinho.</label>
    <div class="composer-row">
      <textarea id="gastoInput" rows="1" placeholder="Ex: paguei 1200 de frete dos aparelhos"></textarea>
      <button class="send" id="sendBtn" aria-label="Registrar gasto">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="#061309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="examples">ex.: "comprei estoque de capinhas por 850", "conta de luz da loja 620", "paguei comissão da Bruna 900"</div>

    <div class="confirm" id="confirmBox" style="display:none;">
      <div class="status-line" id="statusLine">Confira e salve:</div>
      <div class="grid">
        <div class="field" id="fieldValor">
          <label>Valor (R$)</label>
          <input type="number" step="0.01" min="0" id="inValor" placeholder="0,00" />
          <div class="field-error-msg" id="valorErr" style="display:none;">Informe o valor</div>
        </div>
        <div class="field">
          <label>Categoria</label>
          <select id="inCategoria"></select>
        </div>
        <div class="field full">
          <label>Descrição</label>
          <input type="text" id="inDescricao" maxlength="80" />
        </div>
        <div class="field">
          <label>Data</label>
          <input type="date" id="inData" />
        </div>
      </div>
      <div class="confirm-actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Salvar gasto</button>
      </div>
      <div class="toast" id="toast">Gasto registrado ✓</div>
    </div>
  </div>

  <div class="card hero">
    <div class="row-top">
      <div>
        <div class="label">Total
